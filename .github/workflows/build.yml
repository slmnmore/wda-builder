name: Build iOS 15 WebDriverAgent

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout WebDriverAgent v5.15.8 (iOS 15 Uyumlu)
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: v5.15.8
          fetch-depth: 1

      - name: Build WebDriverAgentRunner for Real Device
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find ./build/Build/Products/Release-iphoneos -name "WebDriverAgentRunner-Runner.app" | head -n 1)
          echo "Bulunan uygulama paketi: $APP_DIR"
          cp -R "$APP_DIR" Payload/
          zip -r WebDriverAgentRunner_iOS15.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner_iOS15
          path: WebDriverAgentRunner_iOS15.ipa
